[project]
name = "teilethuns-chatbot"
version = "1.0.0"
description = "Auskunftshelfer fuer einen Gebrauchtteile-Versandshop: pgvector-Teilesuche, Klick-Interview, eBay-Weiterleitung, getrennte Betriebsleitung"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "bench", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"bench/*" = ["E402"]
"scripts/*" = ["E402"]
