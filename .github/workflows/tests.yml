# Vorlage fuer .github/workflows/tests.yml.
# Liegt hier, weil manche Rechner den Ordner .github nicht von aussen
# beschreiben lassen. upload_to_github.py traegt sie beim Hochladen nach,
# falls sie im Repository noch fehlt.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: passwort
          POSTGRES_DB: teilethuns_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

    env:
      TEST_DATABASE_URL: postgresql://postgres:passwort@127.0.0.1:5432/teilethuns_test
      DATABASE_URL: postgresql://postgres:passwort@127.0.0.1:5432/teilethuns_test
      ALLOWED_ORIGINS: https://example.test
      SHOP_NAME: Teile Thuns
      EMBEDDING_DIM: '384'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Abhaengigkeiten
        run: |
          pip install -r backend/requirements.txt
          pip install pytest ruff

      - name: Stilpruefung
        run: ruff check backend/ bench/ scripts/ tests/

      - name: Tests
        run: python -m pytest tests/ -v

      # Die Geheimnisse werden hier erzeugt, nicht hinterlegt: in dieser
      # Datei soll nichts stehen, was auch nur wie ein Passwort aussieht.
      - name: Geheimnisse fuer den Messlauf erzeugen
        run: |
          python - <<'ENDE' >> $GITHUB_ENV
          import secrets, sys
          sys.path.insert(0, "backend")
          from app.auth import hash_erzeugen
          print("ADMIN_PASSWORD_HASH=" + hash_erzeugen(secrets.token_urlsafe(24)))
          print("SESSION_SECRET=" + secrets.token_urlsafe(48))
          print("SYNC_API_KEY=" + secrets.token_urlsafe(32))
          ENDE

      - name: Messreihe Trefferqualitaet
        env:
          EMBEDDING_PROVIDER: local
        run: python bench/qualitaet.py --teile 1000 --anfragen-bestand 80 --neu-aufbauen

      - name: Messergebnisse sichern
        uses: actions/upload-artifact@v4
        with:
          name: messergebnisse
          path: bench/results/
